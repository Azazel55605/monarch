name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
      - name: Install Qt and desktop validation libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 desktop-file-utils
      - run: uv sync --locked --extra gui --group gui-dev --python ${{ matrix.python }}
      - run: uv run --extra gui --group gui-dev ruff check .
      - run: uv run --extra gui --group gui-dev ruff format --check .
      - run: uv run --extra gui --group gui-dev mypy
      - run: uv run --extra gui --group gui-dev pytest
      - run: uv build
      - run: uv run --extra gui --group gui-dev python tools/check_artifacts.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
      - run: uv build --out-dir dist/candidate
      - run: python3 tools/build_arch_package.py --prepare-only --sdist dist/candidate/monarch_displays-*.tar.gz --output dist/arch-source
      - run: docker build --tag monarch-arch-builder packaging/arch
      - run: mkdir -p dist/arch
      - name: Build, check, install and remove in clean Arch
        run: >-
          docker run --rm --init
          --env OUT_UID=$(id -u) --env OUT_GID=$(id -g)
          --mount type=bind,source=${{ github.workspace }}/dist/arch-source,target=/input,readonly
          --mount type=bind,source=${{ github.workspace }}/dist/arch,target=/output
          monarch-arch-builder
      - run: python3 tools/check_artifacts.py dist/candidate
      - run: cd dist/arch && sha256sum *.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-candidate-${{ github.sha }}
          path: |
            dist/arch/*
            dist/arch-source/*
            dist/candidate/*
          if-no-files-found: error
          retention-days: 14
