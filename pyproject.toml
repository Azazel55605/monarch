[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "monarch-displays"
version = "0.1.0rc4"
description = "A native Qt monitor editor for Hyprland with guarded previews and Lua integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Monarch contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
monarch = "monarch.cli:main"

[project.urls]
Repository = "https://github.com/Azazel55605/monarch"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "build>=1.3,<2"]
gui-dev = ["pytest-qt>=4.5,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/monarch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/monarch"]

[tool.hatch.build.targets.wheel.shared-data]
"packaging/org.monarch.Monarch.desktop" = "share/applications/org.monarch.Monarch.desktop"
"src/monarch/resources/monarch.svg" = "share/icons/hicolor/scalable/apps/org.monarch.Monarch.svg"
"LICENSE" = "share/licenses/monarch-displays/LICENSE"
"THIRD_PARTY_NOTICES.md" = "share/doc/monarch-displays/THIRD_PARTY_NOTICES.md"
"src/monarch/resources/guide.md" = "share/doc/monarch-displays/quick-start.md"
"CHANGELOG.md" = "share/doc/monarch-displays/CHANGELOG.md"
"docs/testing-guide.md" = "share/doc/monarch-displays/testing-guide.md"
"docs/release-checklist.md" = "share/doc/monarch-displays/release-checklist.md"

"docs/vrr-guide.md" = "share/doc/monarch-displays/vrr-guide.md"
